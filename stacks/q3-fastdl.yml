version: "3.9"
services:
  q3-fastdl:
    image: nginx:alpine
    container_name: q3-fastdl
    ports:
      - "8091:80"
    volumes:
      - /mnt/ssd-jellyfin/gamesrv/Quake3/baseq3:/usr/share/nginx/html/baseq3:ro
      - /mnt/ssd-jellyfin/gamesrv/Quake3/baseq3:/usr/share/nginx/html/cpma:ro
    environment:
      - TZ=America/Argentina/Buenos_Aires
    command:
      - sh
      - -lc
      - |
        cat > /etc/nginx/conf.d/default.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            autoindex off;
            keepalive_timeout 0;
            location ~ \.pk3$$ {
                add_header Access-Control-Allow-Origin *;
                add_header Connection close;
            }
            location / {
                try_files $$uri =404;
            }
        }
        NGINXCONF
        nginx -g 'daemon off;'
    restart: unless-stopped
