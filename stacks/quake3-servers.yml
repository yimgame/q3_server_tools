version: "3.9"

services:
  # Watcher (codigo en projects/q3_server_tools/watcher, github yimgame/q3_server_tools):
  # alias next/prev/volver en los 8 servers, AAS de bots automatico con bspc y salud de CTF
  quake3_ctf_nextmap_watcher:
    image: python:3.13-slim
    container_name: quake3_ctf_nextmap_watcher
    network_mode: host
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /mnt/ssd-jellyfin/gamesrv/Quake3:/game:rw
      - /mnt/ssd-jellyfin/projects/q3_server_tools/watcher:/watcher:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - bash
      - -lc
      - |
        # el volumen /game es de red (SMB/NAS) y no respeta permisos unix reales,
        # ssh rechaza la key ahi por "permisos demasiado abiertos" -- la copiamos
        # al filesystem local del contenedor, donde chmod si funciona de verdad.
        mkdir -p /root/.ssh
        cp /game/scripts/pve_ctf_watcher_key /root/.ssh/watcher_key
        chmod 600 /root/.ssh/watcher_key
        which ssh >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y --no-install-recommends openssh-client -qq)
        exec python3 /watcher/q3_watcher.py
    restart: unless-stopped
    depends_on:
      - quake3_ctf

  # Servidor: FFA (Free For All)
  quake3_ffa:
    image: ubuntu:24.04
    container_name: quake3_ffa
    working_dir: /game
    network_mode: host
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /mnt/ssd-jellyfin/gamesrv/Quake3:/game:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - bash
      - -lc
      - |
        chmod +x /game/ioq3ded.x86_64 || true
        # Motor alternativo (a mano si hace falta volver): /game/cnq3-server-x64
        mkdir -p /game/instances/srv_ffa
        /game/ioq3ded.x86_64 \
        +set fs_basepath /game \
        +set fs_homepath /game/instances/srv_ffa \
        +set fs_game cpma \
        +set dedicated 2 \
        +set net_port 27960 \
        +set sv_allowDownload 1 \
        +set sv_pure 1 \
        +set sv_dlURL "https://q3dl.thrallguards.com.ar/" \
        +set mode_start ffa \
        +set g_gametype 0 \
        +set com_hunkMegs 256 \
        +set com_zoneMegs 128 \
        +set com_soundMegs 128 \
        +set logfile 3 \
        +exec cfg/yimq3a-cpma-ffa-server-gemini.cfg \
        +exec cfg-maps/nextmap_ffa.cfg \
        +set server_motdfile "motd.txt" \
        +set sv_demoRecord 1
    restart: unless-stopped

