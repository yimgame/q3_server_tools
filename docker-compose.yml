  # ===== FastDL (antes stack 40) =====
  q3-fastdl:
    image: nginx:alpine
    container_name: q3-fastdl
    ports:
      - "8091:80"
    volumes:
      - /mnt/ssd-jellyfin/gamesrv/Quake3/baseq3:/usr/share/nginx/html/baseq3:ro
      - /mnt/ssd-jellyfin/gamesrv/Quake3/baseq3:/usr/share/nginx/html/cpma:ro
    environment:
      - TZ=America/Argentina/Buenos_Aires
    command:
      - sh
      - -lc
      - |
        cat > /etc/nginx/conf.d/default.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            autoindex off;
            keepalive_timeout 0;
            location ~ \.pk3$$ {
                add_header Access-Control-Allow-Origin *;
                add_header Connection close;
            }
            location / {
                try_files $$uri =404;
            }
        }
        NGINXCONF
        nginx -g 'daemon off;'
    restart: unless-stopped

  # ===== Generador de listas de mapas (antes stack 39) =====
  q3-map-config-generator:
    image: python:3.13-slim
    container_name: q3-map-config-generator
    working_dir: /app
    ports:
      - "5050:5000"
    volumes:
      - /mnt/ssd-jellyfin/gamesrv/Quake3:/quake3:rw
      - /mnt/ssd-jellyfin/projects/q3-map-config-generator:/app
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - PYTHONDONTWRITEBYTECODE=1
    command:
      - bash
      - -lc
      - |
        pip install --no-cache-dir --quiet flask
        mkdir -p /quake3/cpma/cfg-ra3
        python /app/app.py
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # ===== Launcher (antes stack 41) =====
  q3-launcher:
    image: node:22-alpine
    container_name: q3-launcher
    working_dir: /app
    ports:
      - "3010:80"
    volumes:
      - /mnt/ssd-jellyfin/projects/q3_server_launcher:/app
      - /mnt/ssd-jellyfin/gamesrv/Quake3:/quake3:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Argentina/Buenos_Aires
    command:
      - sh
      - -lc
      - |
        while [ ! -f /app/package.json ]; do echo "esperando archivos..."; sleep 3; done
        cd /app
        npm install --no-fund --no-audit
        npx --yes tsx server.ts
    restart: unless-stopped

